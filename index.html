<!DOCTYPE html>
<!--
  ============================================================================
  index.html — PAGE UNIQUE (one-page)
  ----------------------------------------------------------------------------
  ⚠️  Ce fichier ne contient AUCUN texte "en dur" ni le nom de l'entreprise.
      - Textes        →  js/translations.js  (data-i18n="cle")
      - Nom/logo/coord →  js/config.js
      - Produits/producteurs/images →  js/content.js + js/config.js
      Tu ne devrais quasiment jamais avoir à modifier ce fichier.
  ============================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ======================= SEO PRINCIPAL =======================
       Ces balises sont aussi mises à jour dynamiquement par js/main.js
       selon la langue (voir SITE_CONFIG.seo dans js/config.js). -->
  <title>Chi-Agri | Exporter of fresh exotic fruits from Mauritius</title>
  <meta name="description" content="Chi-Agri is a Mauritian exporter of fresh exotic fruits: Victoria pineapple and passion fruit, grown on our own farms in Mauritius. Based in Port Louis." />
  <meta name="keywords" content="Chi-Agri, exotic fruit export Mauritius, Victoria pineapple, passion fruit, pineapple farm Mauritius, Mauritius fruit exporter, Port Louis, fresh exotic fruits" />
  <meta name="author" content="Chi-Agri" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <link rel="canonical" href="https://exemple-chi-agri.com/" />
  <meta name="theme-color" content="#EA2839" />

  <!-- Langues (met à jour les URLs quand le vrai domaine est connu) -->
  <link rel="alternate" hreflang="en" href="https://exemple-chi-agri.com/" />
  <link rel="alternate" hreflang="fr" href="https://exemple-chi-agri.com/" />
  <link rel="alternate" hreflang="x-default" href="https://exemple-chi-agri.com/" />

  <!-- Open Graph (partage Facebook / LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Chi-Agri" />
  <meta property="og:title" content="Chi-Agri | Exporter of fresh exotic fruits from Mauritius" />
  <meta property="og:description" content="Victoria pineapple and passion fruit, grown on our own farms in Mauritius. Based in Port Louis." />
  <meta property="og:url" content="https://exemple-chi-agri.com/" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="fr_FR" />
  <meta property="og:image" content="https://images.unsplash.com/photo-1649960861739-113b8588eaf8?auto=format&fit=crop&w=1200&h=630&q=75" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Chi-Agri | Exporter of fresh exotic fruits from Mauritius" />
  <meta name="twitter:description" content="Victoria pineapple and passion fruit, grown on our own farms in Mauritius." />
  <meta name="twitter:image" content="https://images.unsplash.com/photo-1649960861739-113b8588eaf8?auto=format&fit=crop&w=1200&h=630&q=75" />

  <!-- Données structurées (Google) : exportateur de fruits -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Chi-Agri",
    "url": "https://exemple-chi-agri.com/",
    "description": "Mauritian exporter of fresh exotic fruits (Victoria pineapple, passion fruit), grown on its own farms in Mauritius.",
    "areaServed": "Worldwide",
    "knowsAbout": ["Exotic fruit export", "Victoria pineapple", "Passion fruit", "Pineapple farming", "Mauritius produce"],
    "address": { "@type": "PostalAddress", "streetAddress": "Sanashee Towers, Reserve Street", "addressLocality": "Port Louis", "addressCountry": "MU" },
    "email": "chiagri_Mauritius@gmail.com",
    "telephone": "+230 57803810",
    "employee": { "@type": "Person", "name": "Jaysen Chinapyel", "jobTitle": "Director" },
    "makesOffer": {
      "@type": "Offer",
      "itemOffered": {
        "@type": "Product",
        "name": "Fresh exotic fruits from Mauritius",
        "category": "Fruit",
        "description": "Victoria pineapple and passion fruit, grown and exported from Mauritius."
      }
    }
  }
  </script>

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://images.unsplash.com" />
  <!-- Poppins/Inter (corps) + Bebas Neue (logo) -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ====================== HEADER ====================== -->
  <header class="site-header">
    <div class="container">
      <a href="#top" class="logo" id="headerLogo" aria-label="Home"></a>
      <nav class="main-nav" id="mainNav" aria-label="Main navigation">
        <a href="#about">
          <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20C4 12 9 5 20 4c0 11-7 16-16 16z"/><path d="M4 20c3-6 7-9 11-11"/></svg></span>
          <span data-i18n="nav.about"></span>
        </a>
        <a href="#products">
          <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 10.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 8z"/><path d="M9 8l1.5-4"/><path d="M15 8l-1.5-4"/></svg></span>
          <span data-i18n="nav.products"></span>
        </a>
        <a href="inquiry.html">
          <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
          <span data-i18n="nav.cta"></span>
        </a>
      </nav>
      <div class="header-actions">
        <button class="lang-toggle" id="langToggle" aria-label="Switch language">FR</button>
        <button class="nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="top">

    <!-- ====================== HERO ====================== -->
    <section class="hero" id="hero">
      <div class="hero-bg" id="heroBg"></div>
      <div class="hero-overlay"></div>
      <!-- Feuilles tropicales décoratives (remplacent les anciens ronds) -->
      <svg class="hero-leaf leaf-1" viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" d="M96 4C40 9 9 40 4 96c0 0 28-4 49-25S96 30 96 4z"/><path stroke="rgba(255,255,255,.35)" stroke-width="2" fill="none" d="M18 82C40 60 62 38 88 14"/></svg>
      <svg class="hero-leaf leaf-2" viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" d="M96 4C40 9 9 40 4 96c0 0 28-4 49-25S96 30 96 4z"/><path stroke="rgba(255,255,255,.35)" stroke-width="2" fill="none" d="M18 82C40 60 62 38 88 14"/></svg>

      <div class="container">
        <!-- data-i18n-html : la traduction contient un <span> surligné (dégradé drapeau) -->
        <h1 data-i18n-html="hero.title"></h1>
        <p class="hero-tagline" data-i18n="hero.tagline"></p>
        <div class="hero-actions">
          <a href="#products" class="btn btn-accent" data-i18n="hero.ctaPrimary"></a>
          <a href="inquiry.html" class="btn btn-ghost" data-i18n="hero.ctaSecondary"></a>
        </div>
      </div>
      <a href="#about" class="hero-scroll" aria-hidden="true">⌄</a>
    </section>

    <!-- ====================== À PROPOS (+ chiffres intégrés) ====================== -->
    <section id="about" class="mesh">
      <div class="container about-grid">
        <div class="about-text reveal">
          <span class="kicker" data-i18n="about.kicker"></span>
          <h2 data-i18n="about.title"></h2>
          <p data-i18n="about.p1"></p>
          <p data-i18n="about.p2"></p>
        </div>
        <div class="about-visual reveal">
          <!-- Carrousel de photos qui défilent (générées par main.js) -->
          <div class="carousel" id="aboutCarousel" aria-label="Photos"><!-- slides via main.js --></div>
          <div class="carousel-dots" id="aboutDots"><!-- puces via main.js --></div>
        </div>
      </div>
      <!-- Chiffres clés intégrés dans la section (générés par main.js) -->
      <div class="container about-stats stagger" id="statsGrid"><!-- généré par main.js --></div>
    </section>

    <!-- ==== NOS PRODUCTEURS : retirée pour l'instant (à ré-ajouter plus tard) ==== -->

    <!-- ====================== PRODUITS ====================== -->
    <section id="products" class="mesh">
      <div class="container">
        <div class="section-head reveal">
          <span class="kicker" data-i18n="products.kicker"></span>
          <h2 data-i18n="products.title"></h2>
          <p data-i18n="products.intro"></p>
        </div>
        <div class="products-grid stagger" id="productsGrid"><!-- généré par main.js --></div>
      </div>
    </section>

    <!-- ==== POURQUOI MAURICE : section supprimée ==== -->

    <!-- ====================== CONTACT ====================== -->
    <section id="contact" class="mesh">
      <div class="container">
        <div class="section-head reveal">
          <span class="kicker" data-i18n="contact.kicker"></span>
          <h2 data-i18n="contact.title"></h2>
          <p data-i18n="contact.intro"></p>
        </div>

        <div class="contact-single reveal">
          <aside class="contact-info">
            <h3 data-i18n="contact.info.title"></h3>
            <div class="info-item">
              <div class="info-label" data-i18n="contact.info.personLabel"></div>
              <span id="infoPerson"></span>
            </div>
            <div class="info-item">
              <div class="info-label" data-i18n="contact.info.emailLabel"></div>
              <a id="infoEmail" href="#"></a>
            </div>
            <div class="info-item">
              <div class="info-label" data-i18n="contact.info.phoneLabel"></div>
              <a id="infoPhone" href="#"></a>
            </div>
            <div class="info-item">
              <div class="info-label" data-i18n="contact.info.addressLabel"></div>
              <span id="infoAddress"></span>
            </div>
            <a href="inquiry.html" class="btn btn-accent" data-i18n="contact.sendInquiry"></a>
          </aside>
        </div>
      </div>
    </section>

  </main>

  <!-- ====================== FOOTER ====================== -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-brand">
          <span class="logo" id="footerLogo"></span>
          <p data-i18n="footer.tagline"></p>
        </div>
        <div>
          <h4 data-i18n="footer.nav"></h4>
          <ul>
            <li><a href="#about"    data-i18n="nav.about"></a></li>
            <li><a href="#products" data-i18n="nav.products"></a></li>
            <li><a href="inquiry.html" data-i18n="nav.cta"></a></li>
          </ul>
        </div>
        <div>
          <h4 data-i18n="footer.contact"></h4>
          <ul>
            <li><a id="footerEmail" href="#"></a></li>
            <li><a id="footerPhone" href="#"></a></li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom">
        <span>© <span id="footerYear"></span> <span data-i18n="footer.rights"></span></span>
        <span data-i18n="footer.madeWith"></span>
      </div>
    </div>
  </footer>

  <!-- ====================== FENÊTRE PRODUCTEUR (modal) ====================== -->
  <div class="modal-overlay" id="producerModal" role="dialog" aria-modal="true">
    <div class="modal">
      <button class="modal-close" id="modalClose" aria-label="Close">×</button>
      <div class="modal-img" id="modalImg"></div>
      <div class="modal-body">
        <span class="modal-region" id="modalRegion"></span>
        <h3 id="modalName"></h3>
        <p id="modalBio"></p>
        <div class="modal-meta">
          <div>
            <div class="mm-label" data-i18n="producers.modal.founded"></div>
            <div class="mm-value" id="modalFounded"></div>
          </div>
          <div>
            <div class="mm-label" data-i18n="producers.modal.area"></div>
            <div class="mm-value" id="modalArea"></div>
          </div>
        </div>
        <div class="modal-specialties">
          <div class="ms-label" data-i18n="producers.modal.specialties"></div>
          <div class="modal-tags" id="modalTags"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ====================== SCRIPTS ======================
       ⚠️ L'ordre compte : config → content → translations → main -->
  <script src="js/config.js"></script>
  <script src="js/content.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
