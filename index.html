<!DOCTYPE html>
<!--
  ============================================================================
  index.html — PAGE UNIQUE (one-page)
  ----------------------------------------------------------------------------
  ⚠️  Ce fichier ne contient AUCUN texte "en dur" ni le nom de l'entreprise.
      - Textes        →  js/translations.js  (data-i18n="cle")
      - Nom/logo/coord →  js/config.js
      - Produits/producteurs/images →  js/content.js + js/config.js
      Tu ne devrais quasiment jamais avoir à modifier ce fichier.
  ============================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ======================= SEO PRINCIPAL =======================
       Ces balises sont aussi mises à jour dynamiquement par js/main.js
       selon la langue (voir SITE_CONFIG.seo dans js/config.js). -->
  <title>Maurilis — Export de fruits &amp; légumes frais de l'île Maurice vers la France</title>
  <meta name="description" content="Maurilis exporte les fruits et légumes frais de l'île Maurice vers la France : ananas Victoria, letchis, mangues, piments. Sourcing direct chez les producteurs, traçabilité totale, chaîne du froid maîtrisée. Spécialiste import/export B2B." />
  <meta name="keywords" content="export fruits légumes Maurice France, import export île Maurice, fruits tropicaux Maurice, ananas Victoria, letchis Maurice, mangues Maurice, grossiste fruits exotiques, importateur fruits et légumes France, primeurs Maurice, Mauritius fruit export" />
  <meta name="author" content="Maurilis" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <link rel="canonical" href="https://exemple-maurilis.com/" />
  <meta name="theme-color" content="#1A206D" />

  <!-- Langues (met à jour les URLs quand le vrai domaine est connu) -->
  <link rel="alternate" hreflang="en" href="https://exemple-maurilis.com/" />
  <link rel="alternate" hreflang="fr" href="https://exemple-maurilis.com/" />
  <link rel="alternate" hreflang="x-default" href="https://exemple-maurilis.com/" />

  <!-- Open Graph (partage Facebook / LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Maurilis" />
  <meta property="og:title" content="Maurilis — Fresh fruit &amp; vegetable export from Mauritius to France" />
  <meta property="og:description" content="Fresh Mauritian fruits and vegetables exported to France: Victoria pineapple, lychees, mangoes, chillies. Direct grower sourcing, full traceability, controlled cold chain." />
  <meta property="og:url" content="https://exemple-maurilis.com/" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="fr_FR" />
  <meta property="og:image" content="https://images.unsplash.com/photo-1513415277900-a62401e19be4?auto=format&fit=crop&w=1200&h=630&q=75" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Maurilis — Fresh fruit &amp; vegetable export, Mauritius → France" />
  <meta name="twitter:description" content="Fresh Mauritian fruits and vegetables exported to France, direct from partner growers. Full traceability." />
  <meta name="twitter:image" content="https://images.unsplash.com/photo-1513415277900-a62401e19be4?auto=format&fit=crop&w=1200&h=630&q=75" />

  <!-- Données structurées (Google) : entreprise d'import/export -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Maurilis",
    "url": "https://exemple-maurilis.com/",
    "description": "Export of fresh fruits and vegetables from Mauritius to France (B2B import/export).",
    "areaServed": ["FR", "MU"],
    "knowsAbout": ["Fruit export", "Vegetable export", "Mauritius produce", "Import export", "Cold chain logistics"],
    "address": [
      { "@type": "PostalAddress", "addressLocality": "Port-Louis", "addressCountry": "MU" },
      { "@type": "PostalAddress", "addressLocality": "Rungis", "addressCountry": "FR" }
    ],
    "makesOffer": {
      "@type": "Offer",
      "itemOffered": {
        "@type": "Product",
        "name": "Fresh Mauritian fruits & vegetables",
        "category": "Fruits and vegetables",
        "description": "Victoria pineapple, lychees, mangoes, chillies, passion fruit, island vegetables — exported fresh from Mauritius to France."
      }
    }
  }
  </script>

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://images.unsplash.com" />
  <!-- Poppins/Inter (corps) + Pacifico (mot « fantaisie » du titre) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Pacifico&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ====================== HEADER ====================== -->
  <header class="site-header">
    <div class="container">
      <a href="#top" class="logo" id="headerLogo" aria-label="Home"></a>
      <nav class="main-nav" id="mainNav" aria-label="Main navigation">
        <a href="#about">
          <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20C4 12 9 5 20 4c0 11-7 16-16 16z"/><path d="M4 20c3-6 7-9 11-11"/></svg></span>
          <span data-i18n="nav.about"></span>
        </a>
        <a href="#producers">
          <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3-6 7-6s7 2.1 7 6"/></svg></span>
          <span data-i18n="nav.producers"></span>
        </a>
        <a href="#products">
          <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 10.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 8z"/><path d="M9 8l1.5-4"/><path d="M15 8l-1.5-4"/></svg></span>
          <span data-i18n="nav.products"></span>
        </a>
        <a href="#why">
          <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3.5 3 3.5 15 0 18M12 3c-3.5 3-3.5 15 0 18"/></svg></span>
          <span data-i18n="nav.why"></span>
        </a>
        <a href="#contact" class="btn btn-primary" data-i18n="nav.cta"></a>
      </nav>
      <div class="header-actions">
        <button class="lang-toggle" id="langToggle" aria-label="Switch language">FR</button>
        <button class="nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="top">

    <!-- ====================== HERO ====================== -->
    <section class="hero" id="hero">
      <div class="hero-bg" id="heroBg"></div>
      <div class="hero-overlay"></div>
      <!-- Feuilles tropicales décoratives (remplacent les anciens ronds) -->
      <svg class="hero-leaf leaf-1" viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" d="M96 4C40 9 9 40 4 96c0 0 28-4 49-25S96 30 96 4z"/><path stroke="rgba(255,255,255,.35)" stroke-width="2" fill="none" d="M18 82C40 60 62 38 88 14"/></svg>
      <svg class="hero-leaf leaf-2" viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" d="M96 4C40 9 9 40 4 96c0 0 28-4 49-25S96 30 96 4z"/><path stroke="rgba(255,255,255,.35)" stroke-width="2" fill="none" d="M18 82C40 60 62 38 88 14"/></svg>

      <!-- Carte photo "plantation" (couche par-dessus le fond Maurice) -->
      <figure class="hero-photo-card" aria-hidden="true">
        <div class="hpc-img" id="heroCardImg"></div>
        <figcaption class="hpc-cap" data-i18n="hero.cardCaption"></figcaption>
      </figure>

      <div class="container">
        <!-- Badge = rôle : on comprend tout de suite l'activité -->
        <span class="hero-badge" data-i18n="hero.badge"></span>
        <!-- data-i18n-html : la traduction contient un <span> surligné (dégradé drapeau) -->
        <h1 data-i18n-html="hero.title"></h1>
        <p class="hero-subtitle" data-i18n="hero.subtitle"></p>
        <div class="hero-actions">
          <a href="#products" class="btn btn-accent" data-i18n="hero.ctaPrimary"></a>
          <a href="#contact" class="btn btn-ghost" data-i18n="hero.ctaSecondary"></a>
        </div>
      </div>
      <a href="#about" class="hero-scroll" aria-hidden="true">⌄</a>
    </section>

    <!-- ====================== À PROPOS (+ chiffres intégrés) ====================== -->
    <section id="about" class="mesh">
      <div class="container about-grid">
        <div class="about-text reveal">
          <span class="kicker" data-i18n="about.kicker"></span>
          <h2 data-i18n="about.title"></h2>
          <p data-i18n="about.p1"></p>
          <p data-i18n="about.p2"></p>
          <ul class="about-points">
            <li><span class="check">✓</span><span data-i18n="about.point1"></span></li>
            <li><span class="check">✓</span><span data-i18n="about.point2"></span></li>
            <li><span class="check">✓</span><span data-i18n="about.point3"></span></li>
          </ul>
        </div>
        <div class="about-visual reveal">
          <!-- Carrousel de photos qui défilent (générées par main.js) -->
          <div class="carousel" id="aboutCarousel" aria-label="Photos"><!-- slides via main.js --></div>
          <div class="carousel-dots" id="aboutDots"><!-- puces via main.js --></div>
          <div class="float-card">
            <span class="fc-emoji">🌿</span>
            <div><b data-i18n="about.point2"></b><span data-i18n="producers.feature3.title"></span></div>
          </div>
        </div>
      </div>
      <!-- Chiffres clés intégrés dans la section (générés par main.js) -->
      <div class="container about-stats stagger" id="statsGrid"><!-- généré par main.js --></div>
    </section>

    <!-- ====================== NOS PRODUCTEURS ====================== -->
    <section id="producers" class="producers bg-alt">
      <div class="producers-bg" id="producersBg"></div>
      <div class="container">
        <div class="section-head reveal">
          <span class="kicker" data-i18n="producers.kicker"></span>
          <h2 data-i18n="producers.title"></h2>
          <p data-i18n="producers.intro"></p>
        </div>

        <div class="producers-features stagger">
          <div class="feature">
            <div class="feature-icon">👐</div>
            <h3 data-i18n="producers.feature1.title"></h3>
            <p data-i18n="producers.feature1.desc"></p>
          </div>
          <div class="feature">
            <div class="feature-icon">🌱</div>
            <h3 data-i18n="producers.feature2.title"></h3>
            <p data-i18n="producers.feature2.desc"></p>
          </div>
          <div class="feature">
            <div class="feature-icon">🔎</div>
            <h3 data-i18n="producers.feature3.title"></h3>
            <p data-i18n="producers.feature3.desc"></p>
          </div>
        </div>

        <!-- Cartes producteurs cliquables (générées depuis content.js) -->
        <div class="producers-grid stagger" id="producersGrid"><!-- généré par main.js --></div>
      </div>
    </section>

    <!-- ====================== PRODUITS ====================== -->
    <section id="products" class="mesh">
      <div class="container">
        <div class="section-head reveal">
          <span class="kicker" data-i18n="products.kicker"></span>
          <h2 data-i18n="products.title"></h2>
          <p data-i18n="products.intro"></p>
        </div>
        <div class="products-grid stagger" id="productsGrid"><!-- généré par main.js --></div>
      </div>
    </section>

    <!-- ====================== POURQUOI MAURICE → FRANCE ====================== -->
    <section id="why" class="why">
      <div class="why-bg" id="whyBg"></div>
      <div class="why-overlay"></div>
      <div class="container">
        <div class="section-head reveal">
          <span class="kicker" data-i18n="why.kicker"></span>
          <h2 data-i18n="why.title"></h2>
        </div>
        <div class="why-grid stagger">
          <div class="why-card">
            <span class="why-num">01</span>
            <div><h3 data-i18n="why.card1.title"></h3><p data-i18n="why.card1.desc"></p></div>
          </div>
          <div class="why-card">
            <span class="why-num">02</span>
            <div><h3 data-i18n="why.card2.title"></h3><p data-i18n="why.card2.desc"></p></div>
          </div>
          <div class="why-card">
            <span class="why-num">03</span>
            <div><h3 data-i18n="why.card3.title"></h3><p data-i18n="why.card3.desc"></p></div>
          </div>
          <div class="why-card">
            <span class="why-num">04</span>
            <div><h3 data-i18n="why.card4.title"></h3><p data-i18n="why.card4.desc"></p></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ====================== CONTACT ====================== -->
    <section id="contact" class="mesh">
      <div class="container">
        <div class="section-head reveal">
          <span class="kicker" data-i18n="contact.kicker"></span>
          <h2 data-i18n="contact.title"></h2>
          <p data-i18n="contact.intro"></p>
        </div>

        <div class="contact-grid reveal">
          <form class="contact-form" id="contactForm" novalidate>
            <div class="field">
              <label for="cf-name" data-i18n="contact.form.name"></label>
              <input type="text" id="cf-name" name="name"
                     data-i18n-attr="placeholder:contact.form.namePlaceholder" required />
            </div>
            <div class="field">
              <label for="cf-email" data-i18n="contact.form.email"></label>
              <input type="email" id="cf-email" name="email"
                     data-i18n-attr="placeholder:contact.form.emailPlaceholder" required />
            </div>
            <div class="field">
              <label for="cf-company" data-i18n="contact.form.company"></label>
              <input type="text" id="cf-company" name="company"
                     data-i18n-attr="placeholder:contact.form.companyPlaceholder" />
            </div>
            <div class="field">
              <label for="cf-message" data-i18n="contact.form.message"></label>
              <textarea id="cf-message" name="message"
                        data-i18n-attr="placeholder:contact.form.messagePlaceholder" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary" data-i18n="contact.form.submit"></button>
          </form>

          <aside class="contact-info">
            <h3 data-i18n="contact.info.title"></h3>
            <div class="info-item">
              <div class="info-label" data-i18n="contact.info.emailLabel"></div>
              <a id="infoEmail" href="#"></a>
            </div>
            <div class="info-item">
              <div class="info-label" data-i18n="contact.info.phoneLabel"></div>
              <a id="infoPhone" href="#"></a>
            </div>
            <div class="info-item" id="infoPhoneFrItem">
              <div class="info-label" data-i18n="contact.info.phoneFrLabel"></div>
              <a id="infoPhoneFr" href="#"></a>
            </div>
            <div class="info-item">
              <div class="info-label" data-i18n="contact.info.addressLabel"></div>
              <span id="infoAddress"></span>
            </div>
          </aside>
        </div>
      </div>
    </section>

  </main>

  <!-- ====================== FOOTER ====================== -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-brand">
          <span class="logo" id="footerLogo"></span>
          <p data-i18n="footer.tagline"></p>
        </div>
        <div>
          <h4 data-i18n="footer.nav"></h4>
          <ul>
            <li><a href="#about"     data-i18n="nav.about"></a></li>
            <li><a href="#producers" data-i18n="nav.producers"></a></li>
            <li><a href="#products"  data-i18n="nav.products"></a></li>
            <li><a href="#why"       data-i18n="nav.why"></a></li>
          </ul>
        </div>
        <div>
          <h4 data-i18n="footer.contact"></h4>
          <ul>
            <li><a id="footerEmail" href="#"></a></li>
            <li><a id="footerPhone" href="#"></a></li>
          </ul>
        </div>
        <div>
          <h4 data-i18n="footer.follow"></h4>
          <ul>
            <li><a id="footerLinkedin" href="#" target="_blank" rel="noopener">LinkedIn</a></li>
            <li><a id="footerInstagram" href="#" target="_blank" rel="noopener">Instagram</a></li>
            <li><a id="footerFacebook" href="#" target="_blank" rel="noopener">Facebook</a></li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom">
        <span>© <span id="footerYear"></span> <span data-i18n="footer.rights"></span></span>
        <span data-i18n="footer.madeWith"></span>
      </div>
    </div>
  </footer>

  <!-- ====================== FENÊTRE PRODUCTEUR (modal) ====================== -->
  <div class="modal-overlay" id="producerModal" role="dialog" aria-modal="true">
    <div class="modal">
      <button class="modal-close" id="modalClose" aria-label="Close">×</button>
      <div class="modal-img" id="modalImg"></div>
      <div class="modal-body">
        <span class="modal-region" id="modalRegion"></span>
        <h3 id="modalName"></h3>
        <p id="modalBio"></p>
        <div class="modal-meta">
          <div>
            <div class="mm-label" data-i18n="producers.modal.founded"></div>
            <div class="mm-value" id="modalFounded"></div>
          </div>
          <div>
            <div class="mm-label" data-i18n="producers.modal.area"></div>
            <div class="mm-value" id="modalArea"></div>
          </div>
        </div>
        <div class="modal-specialties">
          <div class="ms-label" data-i18n="producers.modal.specialties"></div>
          <div class="modal-tags" id="modalTags"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ====================== SCRIPTS ======================
       ⚠️ L'ordre compte : config → content → translations → main -->
  <script src="js/config.js"></script>
  <script src="js/content.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
